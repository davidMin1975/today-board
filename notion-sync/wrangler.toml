name = "today-board-notion-sync"
main = "src/worker.js"
compatibility_date = "2024-09-23"
workers_dev = true

[vars]
# 할일 DB / 일정 DB ID (시크릿 아님 — 공개돼도 무방)
TODO_DB = "a3f4897d-7022-475e-bfc7-3ff20a2c6a3a"
SCHED_DB = "86fccaac-3fc6-49fa-8089-dcfed6e8fb53"
# 통합 업무 실행 DB는 Today Board에 읽기 전용으로 표시한다.
UNIFIED_WORK_DB = "543f140a-2ab8-4dc9-bade-e46bbddcf4e0"
# 대시보드 오리진 (CORS 허용 대상). 커스텀 도메인 쓰면 변경.
ALLOW_ORIGIN = "https://davidmin1975.github.io"
# [2026-09-23] "법인 설립 준비" 프로젝트(📁 업무 프로젝트 DB)에 연결된 할일은 대시보드에서 제외.
# 아침/저녁 브리핑에는 이미 나오지 않던 항목이라 대시보드와 표기를 통일하기 위함.
EXCLUDED_PROJECT_IDS = "3b46f832-1912-816c-a315-ccc95b3ceac2"

# ── 시크릿은 wrangler로 별도 등록 (wrangler.toml 에 넣지 말 것) ──
#   npx wrangler secret put NOTION_TOKEN   ← Notion 내부 통합 토큰 (필수)
#   npx wrangler secret put SYNC_KEY       ← 임의 문자열 (선택, 권장)
